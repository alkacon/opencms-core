#
# Valori per lo schema Decoration
#
label.Decoration.filename		=File di decorazione
label.Decoration.filename.help		=Il file di raggruppamento delle decorazioni con la lista delle parole da decorare e le loro decorazioni.
label.Decoration.markfirst		=Seleziona la prima occorrenza
label.Decoration.markfirst.help		=Selezionare questa casella di controllo, se la prima occorrenza di questa decorazione deve essere differente dalle altre.
label.Decoration.name			=Nome
label.Decoration.name.help		=Inserire un nome per questa decorazione.
label.Decoration.posttext		=Post-testo
label.Decoration.posttext.help		=Questo è il testo che è inserito dopo una parola da decorare. È possibile usare le seguenti variabili nel testo: ${decoration} per inserire del testo di decorazione; ${locale} per inserire la localizzazione.
label.Decoration.posttextfirst		=Post-testo (prima occorrenza)
label.Decoration.posttextfirst.help	=Questo è il post-testo usato per la prima occorrenza di una parola da decorare. Richiesto solo se \u201CSeleziona la prima\u201D è abilitato.
label.Decoration.pretext		=Pre-testo
label.Decoration.pretext.help		=Questo è il testo che è inserito prima della parola decorata. È possibile usare una delle seguenti variabili nel testo: ${decoration} per inserire del testo di decorazione; ${locale} per inserire la localizzazione.
label.Decoration.pretextfirst		=Pre-testo (prima occorrenza)
label.Decoration.pretextfirst.help	=Questo è il pre-testo utilizzato per la prima occorrenza di una parola da decorare. Richiesto solo se \u201CSeleziona la prima\u201D è abilitato.


