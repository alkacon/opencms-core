GUI_GIT_APP_UNCONFIGURED_0=<h1>\n\
		Il plug-in Git non \u00e8 configurato correttamente.\n\
	</h1>\n\
	<p>\n\
		Si sono verificati problemi durante la lettura del file di configurazione <code>module-checkin.conf</code> in <code>WEB-INF/git-scripts/</code> o di altre configurazioni in <code>WEB-INF/git-scripts/config/</code>.\n\
	</p>\n\
	<p>\n\
		Verificare che sia presente almeno un file e che contenga una configurazione valida. Il file <code>module-checkin.conf.demo</code> in <code>WEB-INF/git-scripts/</code> pu\u00f2 essere usato come modello per la propria configurazione.\n\
	</p>
