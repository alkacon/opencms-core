label.JspSearchConfig.Title=Titolo
label.JspSearchConfig.Title.help=Titolo collegato alla propriet\u00e0 title, utile per identificare la configurazione del modulo di ricerca.
label.JspSearchConfig.Core=Nucleo Solr
label.JspSearchConfig.Core.help=Nucleo Solr da usare per la ricerca. Di solito non serve impostarlo esplicitamente, perch\u00e9 altrimenti viene scelto il nucleo predefinito.
label.JspSearchConfig.Index=Indice Solr
label.JspSearchConfig.Index.help=Indice Solr da usare per la ricerca. Se non configurato, nel progetto online viene usato \u201cSolr Online\u201d e negli altri progetti \u201cSolr Offline\u201d.
label.JspSearchConfig.MaxReturnedResults=Risultati massimi restituiti
label.JspSearchConfig.MaxReturnedResults.help=Numero massimo di risultati restituiti. Se non specificato, viene usato il valore predefinito dell\u2019indice.
label.JspSearchConfig.SearchForEmptyQuery=Cerca anche con interrogazione vuota
label.JspSearchConfig.SearchForEmptyQuery.help=Se abilitato, quando l\u2019interrogazione \u00e8 vuota viene eseguita una ricerca per \u201c*\u201d. Altrimenti, con interrogazione vuota non viene eseguita alcuna ricerca.
label.JspSearchConfig.IgnoreQuery=Ignora interrogazione
label.JspSearchConfig.IgnoreQuery.help=Se questa opzione \u00e8 selezionata, la stringa di interrogazione inviata tramite parametro della richiesta viene ignorata. L\u2019interrogazione deve essere specificata nei \u201cParametri Solr aggiuntivi\u201d. L\u2019opzione \u00e8 particolarmente utile durante la visualizzazione di elenchi, non di moduli di ricerca.
label.JspSearchConfig.IgnoreReleaseDate=Ignora data di rilascio
label.JspSearchConfig.IgnoreReleaseDate.help=Se questa opzione \u00e8 selezionata, le risorse non rilasciate non vengono filtrate in modo predefinito quando si visualizza una pagina in modalit\u00e0 modifica. Online, e offline fuori dalla modalit\u00e0 modifica, l\u2019opzione non si applica.
label.JspSearchConfig.IgnoreExpirationDate=Ignora data di scadenza
label.JspSearchConfig.IgnoreExpirationDate.help=Se questa opzione \u00e8 selezionata, le risorse scadute non vengono filtrate in modo predefinito quando si visualizza una pagina in modalit\u00e0 modifica. Online, e offline fuori dalla modalit\u00e0 modifica, l\u2019opzione non si applica.
label.JspSearchConfig.QueryModifier=Modificatore interrogazione
label.JspSearchConfig.QueryModifier.help=Di solito l\u2019interrogazione inserita viene passata a Solr come \u201cq=la mia ricerca\u201d. Con il modificatore \u00e8 possibile sostituire \u201cla mia ricerca\u201d. Il modificatore pu\u00f2 contenere la macro %(query), sostituita dalla stringa di interrogazione originale. Ad esempio, il modificatore \u201ccontent_en:%(query) OR Title_prop:%(query)\u201d produce \u201cq=content_en:la mia ricerca OR Title_prop:la mia ricerca\u201d per la stringa originale \u201cla mia ricerca\u201d.
label.JspSearchConfig.QueryParam=Parametro richiesta: interrogazione
label.JspSearchConfig.QueryParam.help=Parametro della richiesta inviato per trasmettere la stringa di interrogazione corrente. Predefinito: q.
label.JspSearchConfig.LastQueryParam=Parametro richiesta: ultima interrogazione
label.JspSearchConfig.LastQueryParam.help=Parametro della richiesta inviato per trasmettere l\u2019ultima stringa di interrogazione. Predefinito: lq.
label.JspSearchConfig.EscapeQueryCharacters=Proteggi caratteri dell\u2019interrogazione
label.JspSearchConfig.EscapeQueryCharacters.help=Se questa opzione \u00e8 impostata a true, o non \u00e8 impostata, i caratteri speciali delle interrogazioni Solr (ad esempio \u201c:\u201d, \u201c(\u201d, \u201c[\u201d) vengono protetti nella stringa di interrogazione fornita tramite il parametro della richiesta.
label.JspSearchConfig.ReloadedParam=Parametro richiesta: ricaricata
label.JspSearchConfig.ReloadedParam.help=Parametro della richiesta inviato per indicare che la pagina con il modulo di ricerca \u00e8 stata ricaricata. Predefinito: reloaded.
label.JspSearchConfig.ExtraSolrParams=Parametri interrogazione Solr aggiuntivi
label.JspSearchConfig.ExtraSolrParams.help=Stringa di parametri di interrogazione Solr, passata a Solr senza modifiche. Ad esempio, per limitare il tipo alle pagine contenitore e la ricerca a /sites/default/, usare <code>fq=type:containerpage&fq=parent-folders:"/sites/default/"</code>.
label.JspSearchConfig.AdditionalRequestParams=Parametro richiesta aggiuntivo
label.JspSearchConfig.AdditionalRequestParams.help=I parametri aggiuntivi della richiesta possono essere usati per estendere l\u2019interrogazione Solr in base al valore del parametro.
label.JspSearchConfig.PageParam=Parametro richiesta: pagina corrente
label.JspSearchConfig.PageParam.help=Parametro della richiesta inviato per trasmettere la pagina corrente. Predefinito: page.
label.JspSearchConfig.PageSize=Dimensione pagina
label.JspSearchConfig.PageSize.help=Numero massimo di risultati mostrati in una pagina.
label.JspSearchConfig.PageNavLength=Lunghezza navigazione pagine
label.JspSearchConfig.PageNavLength.help=Lunghezza di una navigazione tra pagine simile a quella di Google. Dovrebbe essere un numero dispari. Ad esempio, scegliendo 5 e trovandosi a pagina 4, vengono mostrati collegamenti alle pagine 2, 3, 4, 5 e 6.
label.JspSearchConfig.SortParam=Parametro richiesta: ordinamento
label.JspSearchConfig.SortParam.help=Parametro della richiesta inviato per trasmettere l\u2019opzione di ordinamento scelta. Predefinito: sort.
label.JspSearchConfig.SortOption=Opzione di ordinamento predefinita
label.JspSearchConfig.SortOption.help=Fornire il valore del parametro dell\u2019opzione di ordinamento predefinita. Se non indicato, l\u2019opzione configurata per prima diventa quella predefinita.
label.JspSearchConfig.SortOption=Opzioni di ordinamento
label.JspSearchConfig.SortOption.help=Specificare le diverse opzioni di ordinamento.
label.JspSearchConfig.FieldFacet=Facet di campo
label.JspSearchConfig.FieldFacet.help=Specificare una facet di campo.
label.JspSearchConfig.RangeFacet=Facet di intervallo
label.JspSearchConfig.RangeFacet.help=Specificare una facet di intervallo.
label.JspSearchConfig.QueryFacet=Facet di interrogazione
label.JspSearchConfig.QueryFacet.help=Specificare una facet di interrogazione.
label.JspSearchConfig.Highlighting=Opzioni di evidenziazione
label.JspSearchConfig.Highlighting.help=Abilitare l\u2019evidenziazione e specificarne le opzioni.

label.AdditionalParamConfig.Param=Nome parametro richiesta
label.AdditionalParamConfig.Param.help=Nome del parametro aggiuntivo della richiesta che deve influenzare la ricerca.
label.AdditionalParamConfig.SolrQuery=Parte interrogazione Solr
label.AdditionalParamConfig.SolrQuery.help=Parte dell\u2019interrogazione Solr da generare usando il valore del parametro aggiuntivo della richiesta. Ad esempio, la parte potrebbe essere \u201cfq=lastmodified:[%(value) TO *]\u201d. La macro \u201c%(value)\u201d viene sostituita dal valore del parametro della richiesta.

label.FieldFacetConfig.Field=Campo facet
label.FieldFacetConfig.Field.help=Nome del campo Solr da cui leggere le voci della facet.
label.FieldFacetConfig.Name=Nome facet
label.FieldFacetConfig.Name.help=Nome usato per identificare la facet. Per impostazione predefinita corrisponde al campo facet.
label.FieldFacetConfig.Label=Etichetta facet
label.FieldFacetConfig.Label.help=Etichetta da mostrare sopra la facet nel modulo. Predefinita: nome della facet.
label.FieldFacetConfig.MinCount=Conteggio minimo
label.FieldFacetConfig.MinCount.help=Numero minimo di occorrenze, calcolate su tutti i risultati di ricerca, che una voce della facet deve avere per essere elencata.
label.FieldFacetConfig.Limit=Numero massimo di voci facet
label.FieldFacetConfig.Limit.help=Numero massimo di voci facet restituite. Predefinito: senza limite.
label.FieldFacetConfig.Prefix=Prefisso
label.FieldFacetConfig.Prefix.help=Prefisso con cui devono iniziare tutte le voci facet raccolte.
label.FieldFacetConfig.Order=Ordine
label.FieldFacetConfig.Order.help=Ordine con cui elencare le voci facet: \u201ccount\u201d (predefinito) oppure \u201cindex\u201d, cio\u00e8 ordinamento alfabetico.
label.FieldFacetConfig.FilterQueryModifier=Modificatore filtro interrogazione
label.FieldFacetConfig.FilterQueryModifier.help=Di solito, quando viene selezionata una voce facet, all\u2019interrogazione Solr viene aggiunto il filtro \u201cfq=facetfield:checkedEntry\u201d. Il modificatore sostituisce checkedEntry. Pu\u00f2 contenere la macro %(value), sostituita dalla voce selezionata. Esempio: il modificatore \u201c[* TO %(value)]\u201d produce il filtro \u201cfq=facetField:[* TO checkedEntry]\u201d.
label.FieldFacetConfig.IsAndFacet=Filtra per tutte le voci selezionate
label.FieldFacetConfig.IsAndFacet.help=Per impostazione predefinita, se viene selezionata pi\u00f9 di una voce facet, vengono cercati risultati che soddisfano almeno una delle condizioni imposte dalle voci selezionate. Selezionando questa opzione, ogni risultato deve soddisfare tutte le condizioni.
label.FieldFacetConfig.PreSelection=Voce facet preselezionata
label.FieldFacetConfig.PreSelection.help=Voce facet gi\u00e0 selezionata al primo caricamento del modulo di ricerca.
label.FieldFacetConfig.IgnoreAllFacetFilters=Ignora tutti i filtri facet e l\u2019interrogazione
label.FieldFacetConfig.IgnoreAllFacetFilters.help=Se selezionato, durante la raccolta delle voci facet non vengono applicati i filtri generati dalle facet n\u00e9 la stringa di interrogazione.
label.FieldFacetConfig.ExcludeTag=Chiave da escludere
label.FieldFacetConfig.ExcludeTag.help=Aggiungere una chiave di un\u2019interrogazione o filtro da escludere esplicitamente per la facet. Per i filtri facet, la chiave \u00e8 il nome della facet; per la stringa di interrogazione \u00e8 \u201cq\u201d.

label.RangeFacetConfig.Range=Campo facet
label.RangeFacetConfig.Range.help=Nome del campo Solr da cui leggere i valori numerici o le date.
label.RangeFacetConfig.Name=Nome facet
label.RangeFacetConfig.Name.help=Nome usato per identificare la facet. Per impostazione predefinita corrisponde al campo facet.
label.RangeFacetConfig.Label=Etichetta facet
label.RangeFacetConfig.Label.help=Etichetta da mostrare sopra la facet nel modulo. Predefinita: nome della facet.
label.RangeFacetConfig.MinCount=Conteggio minimo
label.RangeFacetConfig.MinCount.help=Numero minimo di occorrenze, calcolate su tutti i risultati di ricerca, che una voce della facet deve avere per essere elencata.
label.RangeFacetConfig.Start=Inizio
label.RangeFacetConfig.Start.help=Limite sinistro dell\u2019intervallo completo della facet. In Solr, valore di facet.range.start.
label.RangeFacetConfig.End=Fine
label.RangeFacetConfig.End.help=Limite destro dell\u2019intervallo completo della facet. In Solr, valore di facet.range.end.
label.RangeFacetConfig.Gap=Intervallo
label.RangeFacetConfig.Gap.help=Dimensione dell\u2019intervallo per una voce facet. In Solr, valore di facet.range.gap.
label.RangeFacetConfig.Other=Informazioni aggiuntive
label.RangeFacetConfig.Other.help=Selezionare quali informazioni aggiuntive calcolare sulla facet. In Solr, valore di facet.range.other.
label.RangeFacetConfig.HardEnd=Fine rigida
label.RangeFacetConfig.HardEnd.help=Selezionare se l\u2019intervallo della voce facet pi\u00f9 a destra deve terminare alla fine dell\u2019intervallo completo, oppure pu\u00f2 essere pi\u00f9 ampio mantenendo sempre la dimensione completa dell\u2019intervallo. In Solr, valore di facet.range.hardend.
label.RangeFacetConfig.IsAndFacet=Filtra per tutte le voci selezionate
label.RangeFacetConfig.IsAndFacet.help=Per impostazione predefinita, se viene selezionata pi\u00f9 di una voce facet, vengono cercati risultati che soddisfano almeno una delle condizioni imposte dalle voci selezionate. Selezionando questa opzione, ogni risultato deve soddisfare tutte le condizioni.
label.RangeFacetConfig.Method=Metodo
label.RangeFacetConfig.Method.help=Metodo usato per calcolare la facet, cio\u00e8 il valore di facet.range.method nell\u2019interrogazione Solr finale.
label.RangeFacetConfig.PreSelection=Voce facet preselezionata
label.RangeFacetConfig.PreSelection.help=Voce facet gi\u00e0 selezionata al primo caricamento del modulo di ricerca.
label.RangeFacetConfig.IgnoreAllFacetFilters=Ignora tutti i filtri facet e l\u2019interrogazione
label.RangeFacetConfig.IgnoreAllFacetFilters.help=Se selezionato, durante la raccolta delle voci facet non vengono applicati i filtri generati dalle facet n\u00e9 la stringa di interrogazione.
label.RangeFacetConfig.ExcludeTag=Chiave da escludere
label.RangeFacetConfig.ExcludeTag.help=Aggiungere una chiave di un\u2019interrogazione o filtro da escludere esplicitamente per la facet. Per i filtri facet, la chiave \u00e8 il nome della facet; per la stringa di interrogazione \u00e8 \u201cq\u201d.
option.RangeFacetConfig.Other.before=tutto prima dell\u2019intervallo della facet
option.RangeFacetConfig.Other.between=tutto nell\u2019intervallo della facet
option.RangeFacetConfig.Other.after=tutto dopo l\u2019intervallo della facet

label.QueryFacetConfig.QueryItem=Interrogazione facet
label.QueryFacetConfig.QueryItem.help=Interrogazione filtro usata come voce facet.
label.QueryFacetConfig.Label=Etichetta facet
label.QueryFacetConfig.Label.help=Etichetta da mostrare sopra la facet nel modulo. Predefinita: nome della facet.
label.QueryFacetConfig.IsAndFacet=Filtra per tutte le voci selezionate
label.QueryFacetConfig.IsAndFacet.help=Per impostazione predefinita, se viene selezionata pi\u00f9 di una voce facet, vengono cercati risultati che soddisfano almeno una delle condizioni imposte dalle voci selezionate. Selezionando questa opzione, ogni risultato deve soddisfare tutte le condizioni.
label.QueryFacetConfig.PreSelection=Voce facet preselezionata
label.QueryFacetConfig.PreSelection.help=Voce facet gi\u00e0 selezionata al primo caricamento del modulo di ricerca.
label.QueryFacetConfig.IgnoreAllFacetFilters=Ignora tutti i filtri facet e l\u2019interrogazione
label.QueryFacetConfig.IgnoreAllFacetFilters.help=Se selezionato, durante la raccolta delle voci facet non vengono applicati i filtri generati dalle facet n\u00e9 la stringa di interrogazione.
label.QueryFacetConfig.ExcludeTag=Chiave da escludere
label.QueryFacetConfig.ExcludeTag.help=Aggiungere una chiave di un\u2019interrogazione o filtro da escludere esplicitamente per la facet. Per i filtri facet, la chiave \u00e8 il nome della facet; per la stringa di interrogazione \u00e8 \u201cq\u201d.
label.FacetQueryItem.Query=Interrogazione
label.FacetQueryItem.Query.help=Valore effettivo dell\u2019interrogazione filtro che compone la voce facet, ad esempio \u201clastmodified:[NOW-1MONTHS TO NOW]\u201d per selezionare tutto ci\u00f2 che \u00e8 stato modificato durante l\u2019ultimo mese.
label.FacetQueryItem.Label=Etichetta
label.FacetQueryItem.Label.help=Etichetta utilizzabile per visualizzare la voce facet.

label.HighlightingConfig.Field=Campi evidenziati
label.HighlightingConfig.Field.help=Campi Solr da usare per l\u2019evidenziazione.
label.HighlightingConfig.Snippets=Numero di estratti evidenziati. Predefinito: 1.
label.HighlightingConfig.Snippets.help=Numero massimo di estratti evidenziati restituiti da Solr.
label.HighlightingConfig.FragSize=Dimensione estratto
label.HighlightingConfig.FragSize.help=Dimensione massima, in lettere, di un estratto evidenziato. Predefinito: 100.
label.HighlightingConfig.AlternateField=Campo alternativo
label.HighlightingConfig.AlternateField.help=Campo Solr restituito al posto dell\u2019estratto evidenziato quando non viene trovato alcun estratto.
label.HighlightingConfig.MaxAlternateFieldLength=Dimensione massima campo alternativo
label.HighlightingConfig.MaxAlternateFieldLength.help=Dimensione massima, in lettere, del contenuto del campo alternativo. Predefinita: campo intero.
label.HighlightingConfig.SimplePre=Prefisso evidenziazione
label.HighlightingConfig.SimplePre.help=Stringa aggiunta nell\u2019estratto evidenziato subito prima del termine da evidenziare. Predefinita: <code>&lt;em&gt</code>.
label.HighlightingConfig.SimplePost=Suffisso evidenziazione
label.HighlightingConfig.SimplePost.help=Stringa aggiunta nell\u2019estratto evidenziato subito dopo il termine da evidenziare. Predefinita: <code>&lt;/em&gt</code>.
label.HighlightingConfig.Formatter=Formatter
label.HighlightingConfig.Formatter.help=Formatter usato da Solr per l\u2019evidenziazione. Predefinito: come configurato in Solr.
label.HighlightingConfig.Fragmenter=Frammentatore
label.HighlightingConfig.Fragmenter.help=Frammentatore usato da Solr per l\u2019evidenziazione. Predefinito: come configurato in Solr.
label.HighlightingConfig.UseFastVectorHighlighting=Usa evidenziazione vettoriale rapida
label.HighlightingConfig.UseFastVectorHighlighting.help=Abilita l\u2019evidenziazione vettoriale rapida. Rende pi\u00f9 veloce l\u2019evidenziazione, ma richiede che i campi evidenziati abbiano <code>termOffsets</code>, <code>termPositions</code> e <code>termVectors</code> impostati a <code>true</code>.
label.HighlightingConfig.Param=Parametro diretto
label.HighlightingConfig.Param.help=Aggiungere direttamente parametri di evidenziazione Solr. Fornire i nomi senza il prefisso \u201chl.\u201d, aggiunto automaticamente.

label.PlainParam.Name=Nome
label.PlainParam.Value=Valore

label.SortOptionConfig.SolrValue=Valore Solr
label.SortOptionConfig.SolrValue.help=Valore assegnato al parametro \u201csort\u201d di Solr, ad esempio \u201cTitle_prop asc\u201d o \u201cscore desc\u201d.
label.SortOptionConfig.ParamValue=Valore parametro
label.SortOptionConfig.ParamValue.help=Valore del parametro della richiesta usato per identificare l\u2019opzione di ordinamento. Predefinito: valore Solr.
label.SortOptionConfig.Label=Etichetta
label.SortOptionConfig.Label.help=Etichetta da mostrare per l\u2019opzione di ordinamento, ad esempio \u201cOrdina per: titolo crescente\u201d. Predefinita: valore del parametro configurato.

