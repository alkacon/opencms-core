label.JspSearchConfig.DidYouMeanTab=Forse cercavi
label.JspSearchConfig.DidYouMean=Abilita la funzione \u201cForse cercavi...\u201d
label.JspSearchConfig.DidYouMean.help=La funzione \u201cForse cercavi\u201d propone interrogazioni alternative quando la ricerca non produce risultati.
label.JspSearchConfig.DefaultSortOption=Opzione di ordinamento predefinita

label.DidYouMeanConfig.QueryParam=Parametro richiesta: interrogazione \u201cForse cercavi...\u201d
label.DidYouMeanConfig.QueryParam.help=Parametro della richiesta usato per trasmettere l\u2019interrogazione della funzione \u201cForse cercavi...\u201d. Se il parametro non \u00e8 specificato, viene usata la stringa di interrogazione principale invece di un\u2019interrogazione alternativa dedicata.
label.DidYouMeanConfig.EscapeQuery=Proteggi caratteri dell\u2019interrogazione
label.DidYouMeanConfig.EscapeQuery.help=Se questa opzione \u00e8 impostata a true, i caratteri speciali delle interrogazioni Solr (ad esempio \u201c:\u201d, \u201c(\u201d, \u201c[\u201d) vengono protetti nella stringa di interrogazione \u201cForse cercavi\u201d fornita tramite il parametro della richiesta. Predefinito: stessa impostazione della scheda \u201cOpzioni interrogazione\u201d.
label.DidYouMeanConfig.Collate=Crea suggerimento combinato
label.DidYouMeanConfig.Collate.help=Se questa opzione \u00e8 selezionata (predefinita), viene scelto un suggerimento ottimale tra tutti i suggerimenti.
label.DidYouMeanConfig.Count=Numero massimo di suggerimenti
label.DidYouMeanConfig.Count.help=Selezionare il numero massimo di suggerimenti. Predefinito: 5.

tab.JspSearchConfig.Highlighting.description=<p>Non tutte le opzioni sono utilizzabili in ogni combinazione. Per configurazioni avanzate consigliamo di consultare la guida Solr e usare i parametri diretti.</p>

validation.error.suggestion.count=Il numero massimo di suggerimenti deve essere indicato come numero non negativo.
validation.error.maxreturnedresults=Il numero deve essere compreso tra -1 (illimitato/valore intero massimo) e 9.999.999.999 (senza punti).
error.highlighting.field=Specificare il campo da usare per l\u2019evidenziazione, ad esempio \u201ctext\u201d o \u201ccontent_en\u201d.
error.empty=Il valore vuoto non \u00e8 consentito.
