desc.listconfig=<p>L’<em>elenco</em> visualizza gli elementi di contenuto selezionati in forma di lista.</p>\n<p>Il contenuto viene selezionato nell’editor del modulo dell’<em>elenco</em>. È possibile usare diverse opzioni per specificare quali elementi vengono mostrati nell’<em>elenco</em>.</p>
desc.listconfig.addon=<p>I criteri di ricerca per il contenuto vengono impostati nell’editor del modulo dell’elenco. Lì è possibile usare diverse opzioni per specificare quali elementi devono essere mostrati nell’elenco.</p>
desc.macro_formatter=Consente di eseguire il rendering degli elementi di contenuto combinando i formattatori di frammenti disponibili.
desc.modelgroup=Memorizza la disposizione degli elementi di contenuto e le impostazioni che compongono un gruppo modello.
desc.settings_config=Impostazioni predefinite degli elementi che possono essere condivise da più configurazioni di formattatore.
desc.sitemap_master_config=Configurazione riutilizzabile di tipi di risorsa, formattatori, funzioni, restrizioni e attributi per le mappe del sito.
desc.ugc_config=Impostazioni per la creazione di contenuti generati dagli utenti
desc.site_plugin=File di configurazione che definisce un elenco di plugin per il template e che può essere attivato/disattivato tramite la configurazione della mappa del sito.
desc.attr_editor_config=File di configurazione per la finestra di dialogo dell’editor degli attributi della mappa del sito.
