# System-wide default for each independent budget scope (decimal GB).
# Website roots always form budget scopes. Subsites form separate scopes only
# when their local upload.quota.scope attribute is true. Other subsites share
# their enclosing scope's budget; subordinate budget scopes are counted separately.
# Local attributes include the scope's master configurations and connector values.
# Scope markers and individual upload.quota values are not inherited.
#
# An individual upload.quota overrides the nearest upload.quota.default.
# Defaults may be defined on websites or subsites, including ordinary subsites,
# and apply to budget scopes at or below that location. Neither attribute creates
# a budget scope. The system-wide default applies if neither budget setting exists.
# Accepted values: positive GB with at most one decimal place, or unlimited.
# A missing or empty value leaves the system-wide budget unconfigured.
#
# To override this file, create /system/config/overrides/quotas.properties.
# The override replaces this file completely; values are not merged.
# Changes apply to the Offline workplace after saving.
#
# Examples:
# upload.quota.systemdefault=2
# upload.quota.systemdefault=0.5
# upload.quota.systemdefault=unlimited
