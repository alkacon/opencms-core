      newFullyQualifiedTypeName: org.apache.commons.fileupload2.javax.JavaxServletDiskFileUpload
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.apache.commons.fileupload2.jakarta.servlet5.JakartaServletFileUpload
      newFullyQualifiedTypeName: org.apache.commons.fileupload2.javax.JavaxServletFileUpload
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.apache.commons.fileupload2.jakarta.servlet5.JakartaServletRequestContext
