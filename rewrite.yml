---
type: specs.openrewrite.org/v1beta/recipe
name: JavaxToJakartaAll
displayName: Migrate servlet and JSP Java references to Jakarta, also sets eeTarget.txt to jakarta
recipeList:
  - JavaxToJakarta
  - SetEETargetJakarta

